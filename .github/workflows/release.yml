name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64, name: linux-amd64 }
          - { goos: linux,  goarch: arm64, name: linux-arm64 }
          - { goos: darwin, goarch: arm64, name: darwin-arm64 }
          - { goos: windows, goarch: amd64, name: windows-amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/contenthub-${GITHUB_REF_NAME}-${{ matrix.name }}${ext}" ./cmd/contenthub
      - uses: actions/upload-artifact@v4
        with:
          name: contenthub-${{ matrix.name }}
          path: dist/*

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true