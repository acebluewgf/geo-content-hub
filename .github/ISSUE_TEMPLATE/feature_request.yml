name: 功能建议
description: 提出一个使用场景或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你在做什么事情时遇到了什么限制
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
      description: 你希望系统怎么处理；如果涉及接口，可以贴出期望的请求与响应结构
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你目前怎么绕过
      description: 现有做法、脚本或其他工具